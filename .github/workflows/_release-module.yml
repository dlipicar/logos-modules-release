name: _release-module

# Local reusable workflow — the single place that owns this catalog's
# signing configuration and the default variant list. Every per-module
# workflow (release-<repo>.yml) and the umbrella (release-all.yml)
# delegate here, so switching signing modes only means editing THIS
# file, never the callers. Platforms are the one thing a caller may
# override, via `variants:` — Windows is opt-in per module (see below).
#
# The leading underscore marks it "private": it has only `workflow_call`
# (no `workflow_dispatch`), so it never shows up as a runnable item in
# the Actions UI. It can only be invoked from a sibling workflow via
# `uses: ./.github/workflows/_release-module.yml`.
#
# ── Signing modes ────────────────────────────────────────────────────
# This catalog publishes UNSIGNED (`signing_mode: none`) — matching the
# empty `trustedSigners` in logos-repo.json. Turn on signing when ready:
#
#   inline   — `lgx sign` runs in the workflow using a JWK secret.
#              1. Generate an Ed25519 JWK private key.
#              2. Add it as the `LOGOS_SIGNING_KEY` Actions secret.
#              3. Uncomment the `signing_mode: inline` line + the
#                 `signing_key:` line below; delete `signing_mode: none`.
#              4. Put the matching public DID in `logos-repo.json`
#                 under `trustedSigners`.
#
#   external — a signing rig you control (Jenkins, HSM, hardware token)
#              produces the signed `.lgx`; the key never touches CI.
#              Uncomment the external block; `signing_command` runs with
#              $LGX_PATH (unsigned input) and must either modify it in
#              place or write the signed result to $LGX_SIGNED_OUT.

on:
  workflow_call:
    inputs:
      module_path:
        description: "Path to the module submodule (e.g. submodules/<repo>)."
        type: string
        required: true
      force_build:
        description: |
          Force build — rebuild and REPLACE the already-published
          `<module>-v<version>` release instead of skipping it. Maps to
          the action's `skip_if_published` (inverted): false (default) =
          skip a version that's already fully published; true = republish
          the same version, overwriting its assets.
        type: boolean
        default: false
      variants:
        description: |
          Comma-separated LGX variants to build for this module.
          Defaults to the three natively-buildable ones.

          Add `windows-x86_64` only for a module whose own flake exposes
          `packages.x86_64-windows.*`. That is a CROSS build produced on a
          Linux runner (there is no Nix for Windows), and it only exists
          when the module pins a logos-module-builder that declares the
          x86_64-windows target — modules on a release-tagged builder have
          no such attribute and their Windows job would just fail, turning
          a clean release into a partial one.

          `windows-x86_64` is the exact spelling lgpm computes for that
          platform, and unlike linux it has NO alias: a package labelled
          `windows-amd64` would show up in the catalog and never install.
        type: string
        default: "darwin-arm64,linux-amd64,linux-arm64"

# Forked repos default to a read-only GITHUB_TOKEN; the downstream
# release job needs to create releases / upload assets.
permissions:
  contents: write

jobs:
  release:
    # Back on the upstream action: v1.4 understands `variants:
    # windows-x86_64` and resolves the cross build through the
    # `packages.x86_64-windows.lgx-portable` attribute, so the reason this
    # catalog ran off a fork — a Linux package published under the Windows
    # label — is gone.
    #
    # Pinned to the exact version, not the moving `v1`. `v1` happens to
    # point at the same commit today, but Windows support landed only in
    # v1.4: v1.1 through v1.3 have no windows-x86_64 leg at all, so a
    # major-tag rollback would silently drop the platform rather than fail.
    #
    # KNOWN GAP, upstream: v1.4 maps variant -> runner with a matrix
    # `include:` list that carries a `- variant: windows-x86_64` entry.
    # Per GitHub's documented rule, an include object that cannot merge
    # into any existing combination without overwriting an original matrix
    # value CREATES A NEW COMBINATION — so every caller that does not ask
    # for Windows still gets a windows-x86_64 job, which fails on the 14
    # modules here that expose no such attribute. Until that is fixed
    # upstream (replace `include:` with an expression-valued `runs-on`),
    # expect one red leg and a partial release per run.
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1.4
    with:
      module_path: ${{ inputs.module_path }}
      variants: ${{ inputs.variants }}

      # Normal runs skip a version that's already fully published; "Force
      # build" (force_build: true) republishes it by disabling that skip.
      skip_if_published: ${{ !inputs.force_build }}

      # ─── Variants (edit here, not in each caller) ───────────────────
      # windows-x86_64 is a mingw CROSS build — an ordinary Linux runner
      # produces the PE — and is opt-in upstream, so the full list has to
      # be spelled out rather than left to the action's default. A module
      # whose flake does not expose `packages.x86_64-windows` fails only
      # that leg; the other three still publish as a partial release.
      variants: "darwin-arm64,linux-amd64,linux-arm64,windows-x86_64"

      # ─── Runners and Nix cache (set by variables, not edited here) ───
      # Unset, every job runs GitHub-hosted and only reads the Logos cache.
      # See "Runners and the Nix cache" in the README.
      runner: ${{ vars.RELEASE_RUNNER }}
      build_runners: ${{ vars.RELEASE_BUILD_RUNNERS }}
      # ATTIC_ENDPOINT marks a repo provisioned for the Logos cache, which
      # also gets ATTIC_TOKEN_CI and a public-cache environment.
      cache_environment: ${{ vars.ATTIC_ENDPOINT && 'public-cache' || '' }}

      # ─── Signing mode (edit here, not in each caller) ────────────────
      signing_mode: none

      # Inline signing — uncomment this line (and `signing_key:` at the
      # bottom), then delete `signing_mode: none` above.
      #signing_mode: inline

      # External signing (Jenkins / HSM / hardware token). Uncomment and
      # delete `signing_mode: none`. `signing_command` runs with
      # $LGX_PATH pointing at the unsigned `.lgx`; it must modify that
      # file in place or write the signed package to $LGX_SIGNED_OUT.
      #
      # signing_mode: external
      # signing_command: |
      #   curl -fsSL -X POST --data-binary @"$LGX_PATH" \
      #        -H "X-Build-Id: ${GITHUB_RUN_ID}" \
      #        -o "$LGX_SIGNED_OUT" \
      #        "$JENKINS_SIGNING_URL"

    # Reaches here via `secrets: inherit` from each caller, so the
    # per-module files don't need to know which secret names matter.
    secrets:
      # Both are empty outside Logos-provisioned repos, leaving the cache
      # read-only. ATTIC_TOKEN_PUBLIC is empty here even inside them: it lives
      # in the public-cache environment, and a called job can only read an
      # environment secret whose name its caller passed.
      ATTIC_TOKEN_CI: ${{ secrets.ATTIC_TOKEN_CI }}
      ATTIC_TOKEN_PUBLIC: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
      # Inline mode reads this; none/external ignore it. Uncomment for
      # inline mode.
      #signing_key: ${{ secrets.LOGOS_SIGNING_KEY }}
