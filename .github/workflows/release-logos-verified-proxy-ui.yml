name: Release logos-verified-proxy-ui

# Manually-triggered release for a single submodule. Delegates the
# build / verify / sign / publish pipeline to the local
# _release-module.yml reusable workflow so signing config lives in
# exactly one place.
#
# Source of truth for module name + version is
# submodules/logos-verified-proxy-ui/metadata.json — read by the upstream
# logos-modules-release-action.
#
# This file is generated by scripts/add-module.sh from
# release-module.yml.template. Don't hand-edit the boilerplate; if you
# need to change the pipeline, edit _release-module.yml (shared) or the
# template (affects future modules).

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-verified-proxy-ui
      force_build: ${{ inputs.force_build }}
      # NARROWED below the catalog default, which includes
      # windows-x86_64. Not because Windows is broken any more —
      # verified_proxy_module builds for it as of e8d911b — but because
      # this UI has not picked that up: its flake.lock pins
      # verified_proxy_module at 53a6194, and the fix is partly IN the
      # module's flake.nix (`-d:enable_mcl_lib=false` on the mingw
      # branch, so nim-mcl's llvm-mingw-only path is skipped). A flake
      # input is resolved from this repo's lock, not from the module's
      # own, so the old source is what gets built.
      #
      # Relock this UI onto the module at e8d911b or later, confirm the
      # cross build, then delete this override.
      variants: "darwin-arm64,linux-amd64,linux-arm64"
    secrets: inherit
