name: Release logos-verified-proxy-module

# Manually-triggered release for a single submodule. Delegates the
# build / verify / sign / publish pipeline to the local
# _release-module.yml reusable workflow so signing config lives in
# exactly one place.
#
# Source of truth for module name + version is
# submodules/logos-verified-proxy-module/metadata.json — read by the upstream
# logos-modules-release-action.
#
# This file is generated by scripts/add-module.sh from
# release-module.yml.template. Don't hand-edit the boilerplate; if you
# need to change the pipeline, edit _release-module.yml (shared) or the
# template (affects future modules).

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-verified-proxy-module
      force_build: ${{ inputs.force_build }}
      # Windows is OFF for this module for a KNOWN, specific reason, not
      # merely because nobody tried. The cross build gets through the mingw
      # stdenv, the `ar` shim that Nim's --app:staticlib needs, and the
      # vendored nat-libs, then fails compiling nimbus-eth2:
      #
      #   state_transition_block.nim(1018,32) Error: invalid type:
      #   'typeof(SomeBeaconBlockBody)' in this context
      #
      # USE_SYSTEM_NIM=1 substitutes the nixpkgs Nim, and logos-nix's
      # nixpkgs-windows carries 2.2.4 while nimbus-eth2 needs 2.2.10. The fix
      # belongs in logos-nix. See the module's README for the three
      # plausible-looking non-fixes.
      # Windows is OPT-IN per module and deliberately not enabled here.
      # `packages.x86_64-windows.*` only exists when the module's own
      # flake pins a logos-module-builder that declares the x86_64-windows
      # target; for any other module the Windows job fails and the release
      # ships partial. To enable it for a module that does expose it,
      # uncomment the line below in that module's generated workflow:
      #
      # variants: "darwin-arm64,linux-amd64,linux-arm64,windows-x86_64"
    secrets: inherit
