name: Release logos-hello-ui

# Manually-triggered release for a single submodule. Delegates the
# build / verify / sign / publish pipeline to the local
# _release-module.yml reusable workflow so signing config lives in
# exactly one place.
#
# Source of truth for module name + version is
# submodules/logos-hello-ui/metadata.json — read by the upstream
# logos-modules-release-action.
#
# This file is generated by scripts/add-module.sh from
# release-module.yml.template. Don't hand-edit the boilerplate; if you
# need to change the pipeline, edit _release-module.yml (shared) or the
# template (affects future modules).

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-hello-ui
      force_build: ${{ inputs.force_build }}
      # Windows IS enabled for this module. It is opt-in per module (the
      # template ships it commented out) because the cross attribute
      # `packages.x86_64-windows.lgx-portable` only exists when the
      # module's own flake pins a logos-module-builder that declares the
      # x86_64-windows target. This module's flake.nix does — verified by
      # building that attribute to a real PE32+ DLL. Do NOT copy this line
      # into a module that has not been verified the same way: the job
      # would fail and the release would ship partial.
      variants: "darwin-arm64,linux-amd64,linux-arm64,windows-x86_64"
    secrets: inherit
